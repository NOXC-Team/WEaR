<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WearMessenger - Add Proxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{background:#16213e;border-radius:16px;padding:24px;width:100%;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
h1{color:#2aabee;font-size:18px;margin-bottom:16px;text-align:center}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{flex:1;padding:8px;background:#0f3460;border:none;border-radius:6px;color:#888;font-size:12px;cursor:pointer}
.tab.active{background:#2aabee;color:#fff}
.field{margin-bottom:12px}
label{display:block;color:#888;font-size:11px;margin-bottom:4px}
input{width:100%;padding:10px;background:#0f3460;border:1px solid #2aabee;border-radius:6px;color:#fff;font-size:13px;outline:none}
input:focus{border-color:#4fc3f7}
button{width:100%;padding:12px;background:#2aabee;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
button:hover{background:#4fc3f7}
button:active{transform:scale(0.98)}
.status{margin-top:12px;padding:8px;border-radius:6px;font-size:12px;text-align:center;display:none}
.status.success{background:#1a3a2a;color:#81c784;display:block}
.status.error{background:#3a1a1a;color:#ff6b6b;display:block}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>Add Proxy</h1>
<div class="tabs">
<button class="tab active" onclick="switchTab('socks5')">SOCKS5</button>
<button class="tab" onclick="switchTab('http')">HTTP</button>
<button class="tab" onclick="switchTab('mtproto')">MTProto</button>
</div>
<div id="socks5">
<div class="field"><label>Server</label><input type="text" id="s5-server" placeholder="127.0.0.1"></div>
<div class="field"><label>Port</label><input type="number" id="s5-port" placeholder="1080"></div>
<div class="field"><label>Username (可选)</label><input type="text" id="s5-user" placeholder=""></div>
<div class="field"><label>Password (可选)</label><input type="password" id="s5-pass" placeholder=""></div>
<button onclick="submit('socks5')">添加 SOCKS5 代理</button>
</div>
<div id="http" class="hidden">
<div class="field"><label>Server</label><input type="text" id="h-server" placeholder="127.0.0.1"></div>
<div class="field"><label>Port</label><input type="number" id="h-port" placeholder="8080"></div>
<div class="field"><label>Username (可选)</label><input type="text" id="h-user" placeholder=""></div>
<div class="field"><label>Password (可选)</label><input type="password" id="h-pass" placeholder=""></div>
<button onclick="submit('http')">添加 HTTP 代理</button>
</div>
<div id="mtproto" class="hidden">
<div class="field"><label>Server</label><input type="text" id="m-server" placeholder="127.0.0.1"></div>
<div class="field"><label>Port</label><input type="number" id="m-port" placeholder="443"></div>
<div class="field"><label>Secret</label><input type="text" id="m-secret" placeholder="dd..."></div>
<button onclick="submit('mtproto')">添加 MTProto 代理</button>
</div>
<div id="status" class="status"></div>
</div>
<script>
function switchTab(t){
document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',['socks5','http','mtproto'][i]===t)});
['socks5','http','mtproto'].forEach(id=>{document.getElementById(id).classList.toggle('hidden',id!==t)});
}
function submit(type){
let data={};
if(type==='socks5'){data={type:'socks5',server:gv('s5-server'),port:parseInt(gv('s5-port')),username:gv('s5-user'),password:gv('s5-pass'),secret:''}}
else if(type==='http'){data={type:'http',server:gv('h-server'),port:parseInt(gv('h-port')),username:gv('h-user'),password:gv('h-pass'),secret:''}}
else{data={type:'mtproto',server:gv('m-server'),port:parseInt(gv('m-port')),username:'',password:'',secret:gv('m-secret')}}
if(!data.server||!data.port){showStatus('请填写服务器和端口','error');return}
const btn=document.querySelector('#'+type+' button');
btn.disabled=true;btn.textContent='添加中...';
fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
.then(r=>r.json()).then(d=>{
if(d.status==='ok'){showStatus('添加成功','success')}
else{showStatus(d.message||'添加失败','error');btn.disabled=false;btn.textContent=getBtnText(type)}
}).catch(()=>{showStatus('网络错误','error');btn.disabled=false;btn.textContent=getBtnText(type)});
}
function gv(id){return document.getElementById(id).value}
function getBtnText(t){return t==='socks5'?'添加 SOCKS5 代理':t==='http'?'添加 HTTP 代理':'添加 MTProto 代理'}
function showStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className='status '+type}
</script>
</body>
</html>
